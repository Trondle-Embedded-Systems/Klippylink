<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KlippyLink LEDs</title>
<style>
:root {
  --bg:        #0d0d1a;
  --surface:   #16162a;
  --surface2:  #1e1e38;
  --border:    #2a2a50;
  --accent:    #03a9f4;
  --accent2:   #0277bd;
  --text:      #e8e8f0;
  --dim:       #7070a0;
  --danger:    #ef5350;
  --ok:        #66bb6a;
  --r:         8px;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; min-height: 100vh; }

/* ── Header ── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  height: 52px;
  display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 10;
}
.brand { font-size: 15px; font-weight: 600; color: var(--accent); flex: 1; letter-spacing: .5px; }
select {
  background: var(--surface2); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 4px 8px; font-size: 13px; cursor: pointer;
}

/* ── Main ── */
main { max-width: 680px; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }

/* ── Cards ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.card-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.label { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--dim); }

/* ── Strip canvas ── */
#strip-wrap { padding: 10px 14px; }
#strip-cvs { width: 100%; display: block; border-radius: 6px; cursor: crosshair; background: #111; }
.strip-meta { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--dim); }

/* ── Zones list ── */
.zones-body { padding: 6px; }
.zone-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 10px; border-radius: 6px; cursor: pointer;
  border: 1px solid transparent; margin-bottom: 4px;
  transition: background .12s, border-color .12s;
}
.zone-item:hover { background: var(--surface2); }
.zone-item.active { background: rgba(3,169,244,.1); border-color: var(--accent); }
.zone-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(255,255,255,.2); }
.zone-info { flex: 1; display: flex; flex-direction: column; }
.zone-info .name { font-size: 13px; font-weight: 500; }
.zone-info .meta { font-size: 11px; color: var(--dim); margin-top: 1px; }
.empty { padding: 20px; text-align: center; color: var(--dim); font-size: 13px; }

/* ── Zone editor ── */
.editor-body { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.field-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--dim); margin-bottom: 6px; }
.range-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.range-field { display: flex; flex-direction: column; gap: 4px; }
.range-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); }
.range-label b { color: var(--text); }
input[type=range] { width: 100%; accent-color: var(--accent); height: 4px; }

/* ── Effects grid ── */
.fx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; }
.fx-btn {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 6px; color: var(--text); cursor: pointer; text-align: center;
  transition: border-color .12s, background .12s;
}
.fx-btn:hover { border-color: var(--accent); }
.fx-btn.active { background: rgba(3,169,244,.15); border-color: var(--accent); color: var(--accent); }
.fx-icon { font-size: 20px; display: block; }
.fx-name { font-size: 10px; color: var(--dim); margin-top: 4px; display: block; }
.fx-btn.active .fx-name { color: var(--accent); }

/* ── Colors ── */
.color-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.color-field { display: flex; flex-direction: column; gap: 6px; }
input[type=color] { width: 100%; height: 38px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface2); cursor: pointer; padding: 2px 4px; }

/* ── Buttons ── */
button { border: none; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all .12s; }
.btn-ghost { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 4px 10px; font-size: 12px; }
.btn-ghost:hover { background: rgba(3,169,244,.1); }
.btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 4px 10px; font-size: 12px; }
.btn-danger:hover { background: rgba(239,83,80,.1); }
.btn-apply { background: var(--accent); color: #fff; width: 100%; padding: 10px; font-size: 14px; }
.btn-apply:hover { background: var(--accent2); }
.btn-apply:disabled { opacity: .4; cursor: default; }

/* ── Toast ── */
#toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 20px; padding: 8px 20px; font-size: 13px;
  opacity: 0; pointer-events: none; transition: opacity .25s; white-space: nowrap;
}
#toast.show { opacity: 1; }
#toast.ok    { border-left: 3px solid var(--ok); }
#toast.err   { border-left: 3px solid var(--danger); }

/* ── Responsive ── */
@media (max-width: 400px) {
  .fx-grid { grid-template-columns: repeat(4, 1fr); }
  .range-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
  <div class="brand">⬡ KlippyLink LEDs</div>
  <select id="node-sel" title="Node"><option>Loading…</option></select>
  <select id="strip-sel" title="Strip" style="display:none"></select>
</header>

<main>

  <!-- Strip visualizer -->
  <div class="card">
    <div id="strip-wrap">
      <canvas id="strip-cvs" height="56"></canvas>
      <div class="strip-meta">
        <span id="led-count-lbl">—</span>
        <span>Click strip to select zone</span>
      </div>
    </div>
  </div>

  <!-- Zones -->
  <div class="card">
    <div class="card-header">
      <span class="label">ZONES</span>
      <button class="btn-ghost" id="btn-add">＋ Add Zone</button>
    </div>
    <div id="zones-list" class="zones-body">
      <div class="empty">No zones yet — click Add Zone to start</div>
    </div>
  </div>

  <!-- Zone editor (hidden until a zone is selected) -->
  <div class="card" id="editor" style="display:none">
    <div class="card-header">
      <span id="editor-title" class="label">ZONE 0</span>
      <button class="btn-danger" id="btn-del">Delete</button>
    </div>
    <div class="editor-body">

      <div>
        <div class="field-label">LED RANGE</div>
        <div class="range-row">
          <div class="range-field">
            <div class="range-label"><span>Start</span><b id="v-start">0</b></div>
            <input type="range" id="inp-start" min="0" max="255" value="0">
          </div>
          <div class="range-field">
            <div class="range-label"><span>Count</span><b id="v-count">8</b></div>
            <input type="range" id="inp-count" min="1" max="256" value="8">
          </div>
        </div>
      </div>

      <div>
        <div class="field-label">EFFECT</div>
        <div id="fx-grid" class="fx-grid"></div>
      </div>

      <div>
        <div class="field-label">COLORS</div>
        <div class="color-row">
          <div class="color-field">
            <div class="range-label"><span>Primary</span></div>
            <input type="color" id="inp-color" value="#ff4400">
          </div>
          <div class="color-field" id="color2-wrap">
            <div class="range-label"><span>Secondary</span></div>
            <input type="color" id="inp-color2" value="#000044">
          </div>
        </div>
      </div>

      <div class="range-field">
        <div class="field-label">BRIGHTNESS</div>
        <div class="range-label"><span></span><b id="v-bri">200</b></div>
        <input type="range" id="inp-bri" min="0" max="255" value="200">
      </div>

      <div class="range-field">
        <div class="field-label">SPEED</div>
        <div class="range-label"><span></span><b id="v-spd">128</b></div>
        <input type="range" id="inp-spd" min="0" max="255" value="128">
      </div>

      <button class="btn-apply" id="btn-apply">Apply to Node</button>

    </div>
  </div>

</main>

<div id="toast"></div>

<script>
'use strict';

/* ── Effect definitions (must match led_effect_id_t in led_effects.h) ── */
const EFFECTS = [
  { id: 0, name: 'Solid',   icon: '■', secondary: false },
  { id: 1, name: 'Blink',   icon: '◉', secondary: false },
  { id: 2, name: 'Breathe', icon: '◎', secondary: false },
  { id: 3, name: 'Rainbow', icon: '◈', secondary: false },
  { id: 4, name: 'Chase',   icon: '►', secondary: true  },
  { id: 5, name: 'Wipe',    icon: '▷', secondary: false },
  { id: 6, name: 'Twinkle', icon: '✦', secondary: true  },
];

/* ── Global state ── */
let G = {
  nodes:       [],
  node:        null,
  stripIdx:    0,
  ledCount:    0,
  zones:       {},   /* { zoneId: {start, count, effect, color, color2, bri, speed} } */
  activeZone:  null,
  nextId:      0,
};

/* ── Persistence ── */
function loadLocal() {
  try {
    const s = JSON.parse(localStorage.getItem('klip_led') || '{}');
    G.zones  = s.zones  || {};
    G.nextId = s.nextId || 0;
    /* Convert keys back to numbers */
    const fixed = {};
    for (const [k, v] of Object.entries(G.zones)) fixed[parseInt(k)] = v;
    G.zones = fixed;
  } catch (_) { G.zones = {}; G.nextId = 0; }
}

function saveLocal() {
  localStorage.setItem('klip_led', JSON.stringify({ zones: G.zones, nextId: G.nextId }));
}

/* ── API ── */
async function apiFetch(method, path, body) {
  const opts = { method };
  if (body !== undefined) {
    opts.headers = { 'Content-Type': 'application/json' };
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json().catch(() => null);
}

async function fetchNodes() {
  try {
    const nodes = await apiFetch('GET', '/api/nodes');
    G.nodes = nodes;
    renderNodeSel();
    if (nodes.length && G.node === null) selectNode(nodes[0].name);
    else if (G.node) renderNodeSel();  /* refresh connected status */
  } catch (_) { toast('Cannot reach router', 'err'); }
}

async function sendZone(zoneId) {
  const z = G.zones[zoneId];
  const [r,  g,  b]  = hexToRgb(z.color);
  const [r2, g2, b2] = hexToRgb(z.color2);
  await apiFetch('POST', `/api/nodes/${G.node}/leds/zones`, {
    zone_id: zoneId, strip: G.stripIdx,
    start: z.start, count: z.count, effect: z.effect,
    color: [r, g, b], color2: [r2, g2, b2],
    brightness: z.bri, speed: z.speed,
  });
}

async function applyZone(zoneId) {
  if (!G.node) { toast('Select a node first', 'err'); return; }
  try {
    await sendZone(zoneId);
    toast('Zone applied ✓', 'ok');
  } catch (e) { toast('Send failed — node offline?', 'err'); }
}

async function removeZone(zoneId) {
  if (G.node) {
    try {
      await apiFetch('DELETE', `/api/nodes/${G.node}/leds/zones/${zoneId}`);
    } catch (_) {}
  }
  delete G.zones[zoneId];
  if (G.activeZone === zoneId) G.activeZone = null;
  saveLocal();
  renderAll();
  document.getElementById('editor').style.display = 'none';
}

/* ── Colour helpers ── */
function hexToRgb(hex) {
  const n = parseInt(hex.replace('#', ''), 16);
  return [(n >> 16) & 0xFF, (n >> 8) & 0xFF, n & 0xFF];
}

function dimHex(hex, bri) {
  const [r, g, b] = hexToRgb(hex);
  const f = bri / 255;
  return `rgb(${r*f|0},${g*f|0},${b*f|0})`;
}

/* ── Toast ── */
let _toastTimer;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.className = '', 2500);
}

/* ── Node / strip selection ── */
function renderNodeSel() {
  const sel = document.getElementById('node-sel');
  if (!G.nodes.length) { sel.innerHTML = '<option>No nodes found</option>'; return; }
  sel.innerHTML = G.nodes.map(n =>
    `<option value="${n.name}"${n.name===G.node?' selected':''}>${n.name} ${n.connected?'●':'○'}</option>`
  ).join('');
}

function selectNode(name) {
  G.node = name;
  const nd = G.nodes.find(n => n.name === name);
  if (!nd) return;
  renderStripSel(nd.neopixels || []);
  const count = nd.neopixels && nd.neopixels.length ? nd.neopixels[0].count : 0;
  setStrip(0, count);
}

function renderStripSel(neopixels) {
  const sel = document.getElementById('strip-sel');
  if (!neopixels.length) { sel.style.display = 'none'; return; }
  sel.innerHTML = neopixels.map((n, i) =>
    `<option value="${i}">${n.name} (${n.count})</option>`
  ).join('');
  sel.style.display = neopixels.length > 1 ? '' : 'none';
}

function setStrip(idx, count) {
  G.stripIdx  = idx;
  G.ledCount  = count;
  document.getElementById('led-count-lbl').textContent = count ? `${count} LEDs` : '—';
  document.getElementById('inp-start').max = Math.max(count - 1, 0);
  document.getElementById('inp-count').max = count;
  renderAll();
}

/* ── Strip canvas ── */
function drawStrip() {
  const canvas = document.getElementById('strip-cvs');
  const W = canvas.parentElement.clientWidth - 28;
  canvas.width  = Math.max(W, 1);
  canvas.height = 56;
  const ctx = canvas.getContext('2d');
  const H  = 56;
  const lc = G.ledCount || 1;
  const lw = W / lc;

  /* background */
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, W, H);

  /* zones */
  for (const [id, z] of Object.entries(G.zones)) {
    const x = z.start * lw;
    const w = Math.max(z.count * lw - 1, 2);
    ctx.fillStyle = dimHex(z.color, z.bri);
    ctx.beginPath();
    const r = Math.min(5, w/2, H/2 - 4);
    ctx.roundRect ? ctx.roundRect(x, 4, w, H - 8, r) : ctx.rect(x, 4, w, H - 8);
    ctx.fill();
    if (parseInt(id) === G.activeZone) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, 4, w, H - 8, r) : ctx.rect(x, 4, w, H - 8);
      ctx.stroke();
    }
  }

  /* live preview of editor range while dragging */
  if (G.activeZone !== null) {
    const z = G.zones[G.activeZone];
    if (z) {
      const ps = parseInt(document.getElementById('inp-start').value);
      const pc = parseInt(document.getElementById('inp-count').value);
      if (ps !== z.start || pc !== z.count) {
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(ps * lw, 4, pc * lw, H - 8);
        ctx.setLineDash([]);
      }
    }
  }

  /* LED separator lines (only if not too many) */
  if (lc <= 128) {
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    for (let i = 1; i < lc; i++) {
      const x = i * lw;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
  }
}

/* ── Zones list ── */
function renderZoneList() {
  const el = document.getElementById('zones-list');
  const entries = Object.entries(G.zones);
  if (!entries.length) {
    el.innerHTML = '<div class="empty">No zones yet — click Add Zone to start</div>';
    return;
  }
  el.innerHTML = entries.map(([id, z]) => {
    const fx = EFFECTS[z.effect] || EFFECTS[0];
    const active = parseInt(id) === G.activeZone;
    return `<div class="zone-item${active?' active':''}" onclick="selectZone(${id})">
      <div class="zone-dot" style="background:${dimHex(z.color,z.bri)}"></div>
      <div class="zone-info">
        <span class="name">Zone ${id}</span>
        <span class="meta">${fx.icon} ${fx.name} · LEDs ${z.start}–${z.start+z.count-1}</span>
      </div>
    </div>`;
  }).join('');
}

/* ── Zone editor ── */
function selectZone(id) {
  id = parseInt(id);
  G.activeZone = id;
  const z = G.zones[id];
  if (!z) return;

  document.getElementById('editor-title').textContent = `ZONE ${id}`;
  document.getElementById('inp-start').value  = z.start;
  document.getElementById('inp-count').value  = z.count;
  document.getElementById('v-start').textContent = z.start;
  document.getElementById('v-count').textContent = z.count;
  document.getElementById('inp-color').value  = z.color;
  document.getElementById('inp-color2').value = z.color2;
  document.getElementById('inp-bri').value    = z.bri;
  document.getElementById('inp-spd').value    = z.speed;
  document.getElementById('v-bri').textContent = z.bri;
  document.getElementById('v-spd').textContent = z.speed;

  highlightEffect(z.effect);
  updateSecondaryColor(z.effect);

  document.getElementById('editor').style.display = '';
  renderZoneList();
  drawStrip();
}

function highlightEffect(effectId) {
  document.querySelectorAll('.fx-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.fx) === effectId);
  });
}

function updateSecondaryColor(effectId) {
  const fx = EFFECTS[effectId] || EFFECTS[0];
  document.getElementById('color2-wrap').style.display = fx.secondary ? '' : 'none';
}

function buildEffectGrid() {
  const grid = document.getElementById('fx-grid');
  grid.innerHTML = EFFECTS.map(fx =>
    `<button class="fx-btn" data-fx="${fx.id}" onclick="chooseEffect(${fx.id})">
      <span class="fx-icon">${fx.icon}</span>
      <span class="fx-name">${fx.name}</span>
    </button>`
  ).join('');
}

function chooseEffect(id) {
  if (G.activeZone === null) return;
  G.zones[G.activeZone].effect = id;
  highlightEffect(id);
  updateSecondaryColor(id);
  renderZoneList();
}

function addZone() {
  if (!G.node) { toast('Select a node first', 'err'); return; }
  const id = G.nextId++;
  G.zones[id] = {
    start: 0,
    count: Math.min(8, G.ledCount || 8),
    effect: 0,
    color:  '#ff4400',
    color2: '#000044',
    bri:    200,
    speed:  128,
  };
  saveLocal();
  renderAll();
  selectZone(id);
}

/* ── Full render ── */
function renderAll() {
  renderZoneList();
  drawStrip();
}

/* ── Wire up events ── */
function init() {
  loadLocal();
  buildEffectGrid();
  fetchNodes();
  setInterval(fetchNodes, 12000);

  document.getElementById('node-sel').addEventListener('change', e => selectNode(e.target.value));

  document.getElementById('strip-sel').addEventListener('change', e => {
    const nd = G.nodes.find(n => n.name === G.node);
    if (!nd) return;
    const idx = parseInt(e.target.value);
    setStrip(idx, nd.neopixels[idx].count);
  });

  document.getElementById('btn-add').addEventListener('click', addZone);

  document.getElementById('btn-del').addEventListener('click', () => {
    if (G.activeZone === null) return;
    removeZone(G.activeZone);
  });

  document.getElementById('btn-apply').addEventListener('click', async () => {
    if (G.activeZone === null) return;
    const z = G.zones[G.activeZone];
    z.start  = parseInt(document.getElementById('inp-start').value);
    z.count  = parseInt(document.getElementById('inp-count').value);
    z.color  = document.getElementById('inp-color').value;
    z.color2 = document.getElementById('inp-color2').value;
    z.bri    = parseInt(document.getElementById('inp-bri').value);
    z.speed  = parseInt(document.getElementById('inp-spd').value);
    saveLocal();
    renderAll();
    await applyZone(G.activeZone);
  });

  /* Live slider feedback */
  document.getElementById('inp-start').addEventListener('input', e => {
    document.getElementById('v-start').textContent = e.target.value;
    drawStrip();
  });
  document.getElementById('inp-count').addEventListener('input', e => {
    document.getElementById('v-count').textContent = e.target.value;
    drawStrip();
  });
  document.getElementById('inp-bri').addEventListener('input', e => {
    document.getElementById('v-bri').textContent = e.target.value;
    if (G.activeZone !== null) {
      G.zones[G.activeZone].bri = parseInt(e.target.value);
      renderZoneList();
      drawStrip();
    }
  });
  document.getElementById('inp-spd').addEventListener('input', e => {
    document.getElementById('v-spd').textContent = e.target.value;
  });

  /* Strip click → select zone */
  const canvas = document.getElementById('strip-cvs');
  canvas.addEventListener('click', e => {
    if (!G.ledCount) return;
    const rect = canvas.getBoundingClientRect();
    const x    = (e.clientX - rect.left) * (canvas.width / rect.width);
    const led  = Math.floor(x / (canvas.width / G.ledCount));
    for (const [id, z] of Object.entries(G.zones)) {
      if (led >= z.start && led < z.start + z.count) { selectZone(parseInt(id)); return; }
    }
    G.activeZone = null;
    document.getElementById('editor').style.display = 'none';
    renderAll();
  });

  window.addEventListener('resize', drawStrip);
  drawStrip();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
